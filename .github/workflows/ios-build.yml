name: Build unsigned iOS IPA

# Compiles the Capacitor app on a GitHub-hosted macOS runner (a real Apple
# machine) and uploads an UNSIGNED .ipa. No Apple certificates live here:
# AltStore signs the app with your free Apple ID when you sideload it.
on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write   # the release job below creates a tag and a Release

jobs:
  # Fast self-contained unit + syntax + DOM suite (BirdLogic, index.html inline
  # scripts, and a jsdom boot of the real app). Gates the iOS build below so a
  # logic regression, a stray brace, or a broken/unwired section fails CI before
  # we spend ~2 min compiling on macOS.
  test:
    name: Unit tests (BirdLogic + syntax + DOM)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # The DOM suite needs jsdom from devDependencies.
      - name: Install JS dependencies
        run: npm ci

      - name: Run unit + syntax + DOM tests
        run: npm test

      # jsdom has NO layout engine, so the suite above is blind to geometry by
      # construction — which is exactly how a sideways-drag bug survived three
      # releases and two blind fixes. This drives real Chrome (preinstalled on
      # the runner) and fails if any element's right edge passes the viewport,
      # at the narrowest phone and the largest text setting the app offers.
      - name: Layout — nothing may overflow the screen
        run: npm run test:layout

  build:
    needs: test
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install JS dependencies
        run: npm ci

      # The ios/ folder is gitignored and regenerated fresh each build, so a
      # Windows dev never needs Xcode/CocoaPods locally.
      - name: Add iOS platform
        run: npx cap add ios

      # ios/ is regenerated each build, so (re)inject the app icon + launch
      # image from assets/*.png into the fresh Xcode asset catalog.
      - name: Generate app icon + splash
        run: npx capacitor-assets generate --ios

      - name: Sync web assets into the iOS project
        run: npx cap sync ios

      # Same reason: Info.plist is regenerated, so the location usage string
      # cannot be committed. Without it CoreLocation refuses the request WITHOUT
      # ever prompting, which is how "📍 Here" in Quick outing came to hang
      # forever with no permission dialog. Runs AFTER sync so nothing downstream
      # can clobber the key. Fails loudly if the plist is missing — a silent skip
      # here reproduces the exact bug this is fixing.
      - name: Declare the location permission iOS requires
        run: |
          set -euo pipefail
          PLIST=ios/App/App/Info.plist
          test -f "$PLIST"
          MSG='Bird Chaser uses your location to find birding hotspots near you for a quick outing.'
          /usr/libexec/PlistBuddy -c "Add :NSLocationWhenInUseUsageDescription string $MSG" "$PLIST" 2>/dev/null \
            || /usr/libexec/PlistBuddy -c "Set :NSLocationWhenInUseUsageDescription $MSG" "$PLIST"
          # Prove it stuck; an empty or missing value must fail the build.
          OUT="$(/usr/libexec/PlistBuddy -c 'Print :NSLocationWhenInUseUsageDescription' "$PLIST")"
          echo "NSLocationWhenInUseUsageDescription = $OUT"
          test -n "$OUT"

      - name: Build unsigned .app for device
        run: |
          set -euo pipefail
          # Capacitor 8 uses Swift Package Manager (no CocoaPods, no workspace),
          # so build the .xcodeproj directly. -list first triggers scheme
          # autocreation and logs available schemes for diagnostics.
          xcodebuild -list -project ios/App/App.xcodeproj
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build

      - name: Package .app into an unsigned .ipa
        run: |
          set -euo pipefail
          APP_PATH="$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -n1)"
          echo "Found app bundle: $APP_PATH"
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r -y "$GITHUB_WORKSPACE/BirdChaser-unsigned.ipa" Payload
          ls -lh "$GITHUB_WORKSPACE/BirdChaser-unsigned.ipa"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: BirdChaser-unsigned-ipa
          path: BirdChaser-unsigned.ipa
          if-no-files-found: error

  mockups:
    name: Render release mockups (393px + 402px)
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install JS dependencies
        run: npm ci

      - name: Generate the UI mockups
        run: |
          set -euo pipefail
          mkdir -p mockups/393 mockups/402
          node assets/mockups.js --width 393 --out mockups/393 &
          PID_393=$!
          node assets/mockups.js --width 402 --out mockups/402 &
          PID_402=$!

          STATUS_393=0
          STATUS_402=0
          wait "$PID_393" || STATUS_393=$?
          wait "$PID_402" || STATUS_402=$?
          echo "393px renderer exit code: $STATUS_393"
          echo "402px renderer exit code: $STATUS_402"
          if [ "$STATUS_393" -ne 0 ] || [ "$STATUS_402" -ne 0 ]; then
            echo "::error::Mockup rendering failed (393px=$STATUS_393, 402px=$STATUS_402)"
            exit 1
          fi

      - name: Package both mockup galleries
        run: |
          set -euo pipefail
          test -f mockups/393/README.md
          test -f mockups/402/README.md
          zip -r BirdChaser-mockups.zip mockups
          ls -lh BirdChaser-mockups.zip

      - name: Upload all-menu mockup artifact
        uses: actions/upload-artifact@v4
        with:
          name: BirdChaser-mockups-all-menus
          path: BirdChaser-mockups.zip
          if-no-files-found: error

  # Publish a Release when package.json's version changes.
  #
  # v1.0.62 and v1.0.63 both shipped as commits and were never published: the
  # newest Release sat at v1.0.61 while the app had moved two versions past it,
  # because bumping the version and cutting the Release were separate manual
  # steps and only the first one is forced by anything. This closes that gap.
  #
  # Idempotent by design. It asks GitHub whether the tag already has a Release:
  # a missing Release is created, while an existing one is repaired only when
  # its tag resolves to THIS commit. A later main push with no version bump must
  # never replace an older tag's binary with a build from a different commit.
  #
  # The .ipa attached is the artifact THIS run built from THIS commit, so the
  # binary provably matches the tag rather than being a later rebuild.
  release:
    name: Publish Release when the version changes
    needs: [build, mockups]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0        # commit subject/body become the release notes

      - name: Read the version
        id: ver
        run: |
          set -euo pipefail
          V="$(node -p "require('./package.json').version")"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "tag=v$V" >> "$GITHUB_OUTPUT"
          echo "Version in package.json: $V"

      - name: Has this version already been released?
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node assets/check-release-tag.js "${{ steps.ver.outputs.tag }}" "$GITHUB_SHA"

      - name: Download the IPA this run built
        uses: actions/download-artifact@v4
        with:
          name: BirdChaser-unsigned-ipa

      - name: Download the required all-menu mockups
        uses: actions/download-artifact@v4
        with:
          name: BirdChaser-mockups-all-menus
          path: .

      - name: Repair required assets on the existing Release
        if: steps.check.outputs.exists == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload "${{ steps.ver.outputs.tag }}" \
            BirdChaser-unsigned.ipa \
            BirdChaser-mockups.zip \
            --clobber
          echo "Refreshed required assets on ${{ steps.ver.outputs.tag }}"

      - name: Write the release notes from the commit
        if: steps.check.outputs.exists == 'false'
        run: |
          set -euo pipefail
          # The commit that set the version explains the release better than any
          # generated changelog, because it was written by hand to do exactly
          # that. Subject becomes the title, body becomes the notes.
          git log -1 --pretty=%s > .release-title
          git log -1 --pretty=%b > .release-body
          node assets/release-notes.js .release-body .release-notes
          {
            echo ""
            echo "---"
            echo ""
            echo "The \`.ipa\` below is UNSIGNED and was built by CI from \`${GITHUB_SHA:0:7}\`,"
            echo "the commit this Release points at. Sideload with AltStore."
          } >> .release-notes
          echo "Title: $(cat .release-title)"

      - name: Create the Release
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "${{ steps.ver.outputs.tag }}" \
            BirdChaser-unsigned.ipa \
            BirdChaser-mockups.zip \
            --target "$GITHUB_SHA" \
            --title "$(cat .release-title)" \
            --notes-file .release-notes
          echo "Published ${{ steps.ver.outputs.tag }}"
