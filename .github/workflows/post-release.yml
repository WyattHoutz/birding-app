name: Verify Release and publish mockups

# The installable Release already exists before this workflow starts. A failure
# here is visible and retryable, but cannot delay or invalidate the IPA build.
on:
  workflow_run:
    workflows: ["Build unsigned iOS IPA"]
    types: [completed]

concurrency:
  group: post-release-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  verify:
    name: Re-download and verify the published IPA
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      tag: ${{ steps.ver.outputs.tag }}
    steps:
      - name: Checkout the released commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Read the released version
        id: ver
        run: |
          set -euo pipefail
          V="$(node -p "require('./package.json').version")"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "tag=v$V" >> "$GITHUB_OUTPUT"

      - name: Confirm the Release belongs to this commit
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node assets/check-release-tag.js \
            "${{ steps.ver.outputs.tag }}" \
            "${{ github.event.workflow_run.head_sha }}"

      - name: Require the completed IPA Release
        run: |
          set -euo pipefail
          test "${{ steps.check.outputs.exists }}" = "true"

      - name: Re-download and verify the published IPA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p published
          gh release view "${{ steps.ver.outputs.tag }}" \
            --json tagName,targetCommitish,assets > release.json
          gh release download "${{ steps.ver.outputs.tag }}" \
            --pattern BirdChaser-unsigned.ipa \
            --dir published \
            --clobber
          node assets/verify-release-assets.js \
            release.json \
            "${{ steps.ver.outputs.tag }}" \
            "${{ github.event.workflow_run.head_sha }}" \
            BirdChaser-unsigned.ipa \
            BirdChaser-unsigned.ipa,BirdChaser-beta-guide.txt,BirdChaser-mockups.zip \
            > digests.json
          EXPECTED="$(node -p "require('./digests.json')['BirdChaser-unsigned.ipa'].slice(7)")"
          ACTUAL="$(sha256sum published/BirdChaser-unsigned.ipa | cut -d' ' -f1)"
          echo "Published IPA SHA-256: $ACTUAL"
          test "$ACTUAL" = "$EXPECTED"
          unzip -q published/BirdChaser-unsigned.ipa -d published/ipa
          PUBLIC="$(find published/ipa/Payload -maxdepth 3 -type d -name public | head -n1)"
          test -n "$PUBLIC"
          node assets/verify-release-bundle.js \
            "$PUBLIC" \
            "${{ steps.ver.outputs.version }}"

  mockups:
    name: Render and attach three device galleries
    needs: verify
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the released commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install JS dependencies
        run: npm ci

      - name: Generate every report in all three Display profiles
        run: |
          set -euo pipefail
          mkdir -p mockups/iphone-11 mockups/iphone-17-pro mockups/iphone-17-pro-large \
            mockups/iphone-17-pro-max-magnification
          node assets/mockups.js --width 414 --out mockups/iphone-11 &
          PID_IPHONE_11=$!
          node assets/mockups.js --width 402 --out mockups/iphone-17-pro &
          PID_IPHONE_17_PRO=$!
          node assets/mockups.js --width 402 --scale 1.3 \
            --out mockups/iphone-17-pro-large &
          PID_IPHONE_17_PRO_LARGE=$!
          node assets/mockups.js --width 402 --scale 1.75 \
            --out mockups/iphone-17-pro-max-magnification &
          PID_IPHONE_17_PRO_MAX=$!

          STATUS_IPHONE_11=0
          STATUS_IPHONE_17_PRO=0
          STATUS_IPHONE_17_PRO_LARGE=0
          STATUS_IPHONE_17_PRO_MAX=0
          wait "$PID_IPHONE_11" || STATUS_IPHONE_11=$?
          wait "$PID_IPHONE_17_PRO" || STATUS_IPHONE_17_PRO=$?
          wait "$PID_IPHONE_17_PRO_LARGE" || STATUS_IPHONE_17_PRO_LARGE=$?
          wait "$PID_IPHONE_17_PRO_MAX" || STATUS_IPHONE_17_PRO_MAX=$?
          echo "iPhone 11 renderer exit code: $STATUS_IPHONE_11"
          echo "iPhone 17 Pro renderer exit code: $STATUS_IPHONE_17_PRO"
          echo "iPhone 17 Pro Large renderer exit code: $STATUS_IPHONE_17_PRO_LARGE"
          echo "iPhone 17 Pro High visibility renderer exit code: $STATUS_IPHONE_17_PRO_MAX"
          if [ "$STATUS_IPHONE_11" -ne 0 ] \
            || [ "$STATUS_IPHONE_17_PRO" -ne 0 ] \
            || [ "$STATUS_IPHONE_17_PRO_LARGE" -ne 0 ] \
            || [ "$STATUS_IPHONE_17_PRO_MAX" -ne 0 ]; then
            echo "::error::One or more device mockup renderers failed"
            exit 1
          fi

      - name: Verify and package all galleries
        run: |
          set -euo pipefail
          EXPECTED="$(node -p "require('./assets/mockups.js').SHOTS.length")"
          for VARIANT in iphone-11 iphone-17-pro iphone-17-pro-large iphone-17-pro-max-magnification; do
            test -f "mockups/$VARIANT/README.md"
            ACTUAL="$(find "mockups/$VARIANT" -maxdepth 1 -type f -name '*.png' | wc -l)"
            echo "$VARIANT gallery: $ACTUAL/$EXPECTED PNGs"
            test "$ACTUAL" -eq "$EXPECTED"
          done
          zip -r BirdChaser-mockups.zip mockups
          sha256sum BirdChaser-mockups.zip

      - name: Preserve the gallery as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: BirdChaser-mockups-${{ needs.verify.outputs.version }}
          path: BirdChaser-mockups.zip
          if-no-files-found: error

      - name: Attach the gallery to the existing Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload "${{ needs.verify.outputs.tag }}" \
            BirdChaser-mockups.zip \
            --clobber

      - name: Re-download and verify the published gallery
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf published
          mkdir -p published
          gh release view "${{ needs.verify.outputs.tag }}" \
            --json tagName,targetCommitish,assets > release.json
          gh release download "${{ needs.verify.outputs.tag }}" \
            --pattern BirdChaser-mockups.zip \
            --dir published \
            --clobber
          node assets/verify-release-assets.js \
            release.json \
            "${{ needs.verify.outputs.tag }}" \
            "${{ github.event.workflow_run.head_sha }}" \
            BirdChaser-unsigned.ipa,BirdChaser-mockups.zip \
            BirdChaser-unsigned.ipa,BirdChaser-beta-guide.txt,BirdChaser-mockups.zip \
            > digests.json
          EXPECTED_DIGEST="$(node -p "require('./digests.json')['BirdChaser-mockups.zip'].slice(7)")"
          ACTUAL_DIGEST="$(sha256sum published/BirdChaser-mockups.zip | cut -d' ' -f1)"
          echo "Published mockup SHA-256: $ACTUAL_DIGEST"
          test "$ACTUAL_DIGEST" = "$EXPECTED_DIGEST"
          unzip -q published/BirdChaser-mockups.zip -d published/mockups
          EXPECTED_COUNT="$(node -p "require('./assets/mockups.js').SHOTS.length")"
          for VARIANT in iphone-11 iphone-17-pro iphone-17-pro-large iphone-17-pro-max-magnification; do
            test -f "published/mockups/mockups/$VARIANT/README.md"
            ACTUAL_COUNT="$(find "published/mockups/mockups/$VARIANT" \
              -maxdepth 1 -type f -name '*.png' | wc -l)"
            echo "Published $VARIANT gallery: $ACTUAL_COUNT/$EXPECTED_COUNT PNGs"
            test "$ACTUAL_COUNT" -eq "$EXPECTED_COUNT"
          done

      - name: Checkout the browsable gallery site
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: pages-site

      - name: Build the versioned HTML gallery
        run: |
          set -euo pipefail
          node assets/build-mockup-gallery.js \
            --input published/mockups/mockups \
            --site pages-site \
            --version "${{ needs.verify.outputs.version }}" \
            --release-url "https://github.com/${{ github.repository }}/releases/tag/${{ needs.verify.outputs.tag }}"
          test -f "pages-site/mockups/${{ needs.verify.outputs.tag }}/index.html"

      - name: Publish the browsable gallery
        working-directory: pages-site
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .
          if git diff --cached --quiet; then
            echo "Gallery is already current"
            exit 0
          fi
          git commit -m "Publish ${{ needs.verify.outputs.tag }} mockup gallery"
          git push origin HEAD:gh-pages
