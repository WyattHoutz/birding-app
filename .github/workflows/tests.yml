name: App unit + DOM tests

# These 286 tests used to run in the PRIVATE birding repo, where Actions minutes
# are metered. They cost 234 seconds of every run — about 85% of that workflow —
# and in the first four days of August alone CI there burned 277 minutes out of
# a 2,000-minute monthly allowance.
#
# This repository is PUBLIC, so standard-runner minutes are free. The tests are
# public portion runs from this checkout. Local logic guards additionally read
# the private HAPPENING-NOW contract when present; that consumer stays private.
# A public CI result must not be relabelled as complete private local evidence.
#
# What deliberately did NOT move, and must not:
#
#   Daily birding report   Needs the eBird API key and writes the private data
#                          cache, which holds 4,163 real birders' names. Putting
#                          either in a public workflow would be a key leak and a
#                          personal-data leak in one step.
#
#   Cross-language parity  Compares the app against the Markdown report's golden
#   App-glue smoke test    fixtures, which live in the private repo. Running them
#                          here would mean giving a public workflow credentials
#                          to check out a private repo full of PII. They stay put
#                          and are cheap anyway (~40 s).
#
# So the split is by what each check needs, not by convenience: anything that can
# run on public code alone runs here for free, and anything that needs the
# private data stays behind, on demand only.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Unit, syntax and DOM suites
        run: npm test

  layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      # jsdom cannot check geometry. Keep every viewport/text profile in Chrome.
      - name: Layout — nothing may overflow the screen
        run: npm run test:layout
