name: App unit + DOM tests

# These 286 tests used to run in the PRIVATE birding repo, where Actions minutes
# are metered. They cost 234 seconds of every run — about 85% of that workflow —
# and in the first four days of August alone CI there burned 277 minutes out of
# a 2,000-minute monthly allowance.
#
# This repository is PUBLIC, so standard-runner minutes are free. The tests are
# public portion runs from this checkout. Local logic guards additionally read
# the private HAPPENING-NOW contract when present; that consumer stays private.
# A public CI result must not be relabelled as complete private local evidence.
#
# What deliberately did NOT move, and must not:
#
#   Daily birding report   Needs the eBird API key and writes the private data
#                          cache, which holds 4,163 real birders' names. Putting
#                          either in a public workflow would be a key leak and a
#                          personal-data leak in one step.
#
#   Cross-language parity  Compares the app against the Markdown report's golden
#   App-glue smoke test    fixtures, which live in the private repo. Running them
#                          here would mean giving a public workflow credentials
#                          to check out a private repo full of PII. They stay put
#                          and are cheap anyway (~40 s).
#
# So the split is by what each check needs, not by convenience: anything that can
# run on public code alone runs here for free, and anything that needs the
# private data stays behind, on demand only.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      benchmark_mode:
        description: 'Controlled benchmark only; ordinary main validation remains serial'
        type: choice
        default: serial
        options: [serial, parallel]

permissions:
  contents: read

jobs:
  test:
    if: github.event_name != 'workflow_dispatch' || inputs.benchmark_mode != 'parallel'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # The DOM suite boots www/index.html in jsdom, so devDependencies are
      # required. logic.js and smoke-wiring.js are stdlib-only, but the DOM
      # tests are not.
      - name: Install dependencies
        run: npm ci

      - name: Capture benchmark inputs
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo "CHROME_BIN=$(command -v google-chrome)" >> "$GITHUB_ENV"
          CHROME_BIN="$(command -v google-chrome)" node assets/ci-validation-evidence.js before serial

      - name: Unit, syntax and DOM suites
        run: npm test

      # jsdom has NO LAYOUT ENGINE, so the suite above is blind to geometry.
      # v1.26.13 shipped a 55.6px overflow with a fully green unit suite; the
      # only thing that caught it was this audit, running in the macOS .ipa
      # job — after the expensive runner had already started.
      #
      # Moved here 2026-08-21 so a layout regression fails in ~1 free minute on
      # Linux instead of part-way through a macOS build. A check that exists
      # but fires late still costs the thing it was meant to save.
      #
      # Six viewport/text combinations, in real Chrome: the narrowest phone at
      # the largest text setting is where rows actually break.
      - name: Layout — nothing may overflow the screen
        run: npm run test:layout

      - name: Verify unchanged benchmark inputs
        if: github.event_name == 'workflow_dispatch'
        run: node assets/ci-validation-evidence.js after serial

      - name: Preserve benchmark evidence
        if: always() && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: validation-serial
          path: benchmark-*
          if-no-files-found: error

  catalog:
    if: github.event_name == 'workflow_dispatch' && inputs.benchmark_mode == 'parallel'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Capture benchmark inputs
        run: |
          echo "CHROME_BIN=$(command -v google-chrome)" >> "$GITHUB_ENV"
          CHROME_BIN="$(command -v google-chrome)" node assets/ci-validation-evidence.js before catalog
      - name: Unit, syntax and DOM suites
        shell: bash
        run: npm test 2>&1 | tee benchmark-catalog.log
      - name: Verify unchanged benchmark inputs
        run: node assets/ci-validation-evidence.js after catalog
      - name: Preserve benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-catalog
          path: benchmark-*
          if-no-files-found: error

  layout:
    if: github.event_name == 'workflow_dispatch' && inputs.benchmark_mode == 'parallel'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Capture benchmark inputs
        run: |
          echo "CHROME_BIN=$(command -v google-chrome)" >> "$GITHUB_ENV"
          CHROME_BIN="$(command -v google-chrome)" node assets/ci-validation-evidence.js before layout
      - name: Layout — nothing may overflow the screen
        shell: bash
        run: npm run test:layout 2>&1 | tee benchmark-layout.log
      - name: Verify unchanged benchmark inputs
        run: node assets/ci-validation-evidence.js after layout
      - name: Preserve benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-layout
          path: benchmark-*
          if-no-files-found: error
