<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Section gallery — Bird Chaser</title>
<!--
  Every REPORT SECTION, rendered as a stack of the cards it actually uses.

  cards.html shows the nine templates one at a time, which answers "is this
  shape right". It cannot answer "does this SECTION read well", because a
  section is a heading plus eight of the same card in a row, and the problems
  that live there — a heading that competes with the rows under it, eight
  identical distances forming a column of noise, an expander that vanishes at
  1.75x — only appear in the stack.

  Why this is a gallery and not a screenshot of the app: the app's sections are
  live panels behind buttons that fetch (surgeBtn, refreshBtn, …). There is no
  offline entry point to call. So the sections are COMPOSED here from the same
  card builders the app uses, with the same awkward sample data, and the
  section->template mapping is taken from docs/CARDS.md.

  NO NETWORK, exactly like the app and like cards.html.
-->
<link rel="icon" href="data:," />
<style>
  :root {
    --s: 1;
    --bg: #fff; --ink: #111; --muted: #666; --line: #e3e3e6; --accent: #0a58ca;
  }
  body {
    margin: 0; padding: 18px 16px 60px; background: #f4f4f6; color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
  }
  h1 { font-size: calc(24px * var(--s)); margin: 0 0 4px; }
  .lede { color: var(--muted); font-size: calc(14px * var(--s)); margin: 0 0 16px; max-width: 70ch; }
  .controls {
    display: flex; gap: 14px; align-items: center; flex-wrap: wrap;
    padding: 0 0 14px; border-bottom: 1px solid var(--line); margin-bottom: 18px;
    font-size: calc(13px * var(--s));
  }
  select, label { font-size: inherit; }

  /* The frame, matched to cards.html so the two tools measure the same thing.
     402 x 874 is the iPhone 17 Pro's CSS viewport (DPR 3, 1206 x 2622
     physical) — the same logical size as the 16 Pro. */
  #out { background: var(--bg); }
  #out.phone {
    height: 874px; overflow-y: auto; -webkit-overflow-scrolling: touch;
    border: 10px solid #1c1c1e; border-radius: 44px; padding: 14px 10px;
    box-shadow: 0 8px 28px rgba(0,0,0,.28);
    box-sizing: content-box; scrollbar-width: thin;
  }

  /* A section as the app frames it: a heading, then the rows. Deliberately
     plain — anything decorative here would be a shape the app does not have. */
  .sec { border-top: 1px solid var(--line); padding: 14px 0 4px; }
  .sec:first-child { border-top: 0; }
  .sechead {
    font-size: calc(17px * var(--s)); font-weight: 700; margin: 0 0 2px;
  }
  .secmeta {
    font-size: calc(11px * var(--s)); color: var(--muted); margin: 0 0 10px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  .secmeta b { font-weight: 600; color: var(--ink); }
  .nocards {
    font-size: calc(12px * var(--s)); color: var(--muted); font-style: italic;
    padding: 2px 0 8px;
  }

  /* Greyed, not hidden. A section missing from the gallery reads as "done";
     a section visibly greyed reads as "not done yet", which is the truth. */
  .sec.todo { opacity: .55; }
  .sec.todo .sechead { color: var(--muted); }
  .pill {
    margin-left: 8px; font-size: calc(10px * var(--s)); font-weight: 600;
    text-transform: uppercase; letter-spacing: .04em;
    color: #8a6d1f; background: #fdf3d7; border: 1px solid #edd9a3;
    border-radius: 999px; padding: 1px 7px; vertical-align: middle;
  }
  .secnote {
    font-size: calc(12px * var(--s)); color: var(--muted); margin: 0 0 8px;
  }
  .stub { border-left: 3px solid var(--line); padding: 6px 0 6px 10px; margin-bottom: 6px; }
  .stubrow { font-size: calc(13px * var(--s)); margin: 0 0 3px; }
  .stubwhy {
    font-size: calc(11px * var(--s)); color: var(--muted); font-style: italic; margin-top: 5px;
  }
  footer { margin-top: 28px; color: var(--muted); font-size: calc(12px * var(--s)); }
</style>
</head>
<body>
  <h1>Section gallery</h1>
  <p class="lede">
    Every section of the report, built from the cards it actually uses, in a
    phone. Use it to check how a section READS as a stack — the heading against
    its rows, and the same row repeated eight times. Individual shapes are in
    <a href="cards.html">cards.html</a>; the mapping is in
    <a href="../docs/CARDS.md">docs/CARDS.md</a>.
  </p>

  <div class="controls">
    <label for="scale">Text scale</label>
    <select id="scale">
      <option value="1">1× (default)</option>
      <option value="1.25">1.25×</option>
      <option value="1.5">1.5×</option>
      <option value="1.75">1.75× (largest)</option>
    </select>
    <label for="width">Width</label>
    <select id="width">
      <option value="phone" selected>iPhone 17 Pro — full device</option>
      <option value="">full</option>
      <option value="320">320px</option>
      <option value="375">375px</option>
      <option value="402">402px (iPhone 16/17 Pro)</option>
      <option value="430">430px (Pro Max)</option>
    </select>
    <label for="rows">Rows per section</label>
    <select id="rows">
      <option value="1">1</option>
      <option value="3" selected>3</option>
      <option value="8">8 (a full list)</option>
    </select>
  </div>

  <main id="out"></main>
  <footer id="ver"></footer>

  <script src="cards-species.js"></script>
  <script src="cards-hotspot.js"></script>
  <script src="cards-checklist.js"></script>
  <script>
    (function () {
      'use strict';

      // Same awkward sample data as cards.html, and for the same reason: every
      // layout bug this app has shipped was a long string in a narrow box, so a
      // gallery of short tidy strings proves nothing.
      var LONG_PLACE = 'Marymoor Park--Audubon BirdLoop/Interpretive-Boardwalk';
      var A = function (t) { return '<a href="#" onclick="return false">' + t + '</a>'; };
      var PIN = '<a class="ckmap" href="#" onclick="return false" aria-label="Directions">\uD83D\uDDFA</a>';
      function thumbOf(file, extra) {
        return '<span class="thumb"><img class="birdpic' + (extra || '') +
          '" alt="" src="assets/birds/' + file + '"></span>';
      }
      // Rotated per row so a stack shows the real mix: most species have a
      // photo, some fall back, and a few have nothing at all.
      var THUMBS = [
        thumbOf('tersan.jpg'), thumbOf('merlin.jpg'),
        thumbOf('fallback.svg', ' isfallback'),
        '<span class="thumb nopic"></span>'
      ];
      var BIRDS = [
        ['Terek Sandpiper', 'Edmonds Public Fishing Pier', '11.4'],
        ['Tufted Puffin', LONG_PLACE, '8.1'],
        ['Sooty Grouse', 'Bolt Creek Burn', '32.1'],
        ['Barred Owl', 'Juanita Bay Park', '4.9'],
        ['Red-throated Loon', 'Murden Cove, Bainbridge Island', '17.0'],
        ['Black-Throated Gray Warbler', 'Discovery Park', '12.6'],
        ['American Tree Sparrow', 'Marymoor Park', '8.0'],
        ['Pectoral Sandpiper', 'Crockett Lake, Whidbey Island', '41.2']
      ];
      var PLACES = [
        [LONG_PLACE, '8.1', '270'], ['Discovery Park', '12.6', '291'],
        ['Edmonds Marina', '12.0', '243'], ['Juanita Bay Park', '4.9', '214'],
        ['Bolt Creek Burn', '32.1', '96'], ['Crockett Lake', '41.2', '268'],
        ['Nisqually NWR', '54.5', '283'], ['Ocean Shores jetty', '110.0', '316']
      ];

      // Argument shapes copied from cards.html, which is the working
      // reference. The first version of this file INVENTED them (rank, when,
      // who, where) and every hotspot and checklist row rendered with empty
      // placeholders — a gallery showing the wrong shape is worse than no
      // gallery, because you would tune a layout that does not exist.
      function speciesMedium(i) {
        var b = BIRDS[i % BIRDS.length];
        return window.SpeciesCards.medium({
          icon: THUMBS[i % THUMBS.length], name: A(b[0]),
          // The same tag classes the app emits — needflag / dim / stakeflag —
          // not raw spans. Tags carry their own styling, so bare markup here
          // would show a layout nobody will ever see.
          tags: '<span class="needflag">\uD83D\uDD0D</span>'
              + ' <span class="dim">\u00d71</span>'
              + ' <span class="stakeflag">\uD83D\uDCCD Day ' + ((i % 5) + 1) + '</span>',
          // distMi ONLY. Passing `distance` as well printed the mileage twice.
          distMi: parseFloat(b[2]),
          sub: A(b[1]) + ' ' + A('Aug 3 10:25a') + ' Neil Pankey'
        });
      }
      function speciesSmall(i) {
        var b = BIRDS[i % BIRDS.length];
        return window.SpeciesCards.small({
          icon: THUMBS[i % THUMBS.length], name: A(b[0]), sub: 'seen ' + (i + 2) + ' Jul'
        });
      }
      function hotspotMedium(i) {
        var p = PLACES[i % PLACES.length];
        return window.HotspotCards.medium({
          num: i + 1, name: A(p[0]),
          sub: p[2] + ' species all-time \u00b7 latest Jul 30',
          distance: null, distMi: parseFloat(p[1]),
          unseen: '<ul class="obs card-sm sppl"><li><div class="name">'
                + '<span class="ntext">' + BIRDS[i % BIRDS.length][0] + '</span></div></li></ul>',
          unseenLabel: '1 unseen \uD83D\uDD0D'
        });
      }
      function checklistMedium(i) {
        var pl = PLACES[i % PLACES.length];
        return window.ChecklistCards.medium({
          num: i + 1, place: pl[0], href: '#', species: 60 - i * 3,
          date: 'Aug ' + (i + 1) + ' 12:31 PM', distMi: parseFloat(pl[1]),
          who: 'Dan McDougall-Treacy'
        });
      }
      // F28 — the choice-patch leaderboard row, and the one shape here worth
      // looking at in a stack: the TITLE is a BIRDER and the sub-header is the
      // place, which is the reverse of every other hotspot list in the app.
      // Awkward on both halves on purpose — a parenthesised name and a place
      // name carrying an orthography most fonts have to fall back for — because
      // a stack of tidy short strings has never caught anything here.
      //
      // .patchwho / .patchboard / .patchlift are styled in index.html, not in a
      // card file, so they render plain in this gallery. That is deliberate and
      // is the limit of what this row checks: the SHAPE of the stack, not the
      // weight of the lift.
      var BIRDERS = [
        ['Min-Yu Yang', 'board #14', 'Llama Lake', '126 of 143', '368.1'],
        ['Dianne (Marie) Murray', 'board \u2014', LONG_PLACE, '99 of 110', '221.4'],
        ['Jasper Brueggeman', 'board #3',
         '\u019B\u0315ax\u030C\u02B7adis (Tl\u2019 awh-ah-dees) Park', '32 of 37', '9.7']
      ];
      function patchLeader(i) {
        var b = BIRDERS[i % BIRDERS.length];
        return window.HotspotCards.medium({
          num: i + 1,
          name: '<a class="patchwho" href="#" onclick="return false">' + b[0] + '</a> '
              + '<span class="patchboard">' + b[1] + '</span>',
          distMi: parseFloat(PLACES[i % PLACES.length][1]),
          sub: A(b[2]) + ' \u00b7 ' + b[3] + ' lists \u00b7 '
             + '<span class="patchlift">' + b[4] + '\u00d7</span>'
        });
      }
      // The evidence marks the app derives from the feed's `evidence` field
      // (P photo, A audio, V video) and the observer's note. Rotated so a stack
      // shows the real mix rather than the same row eight times.
      var MARKS = ['\uD83D\uDCF7', '\uD83D\uDD0A', '\uD83D\uDCF7\uD83E\uDDFE', '', '\uD83D\uDCF7\uD83D\uDD0A\uD83E\uDDFE'];
      function checklistSmall(i) {
        var b = BIRDS[i % BIRDS.length];
        return window.ChecklistCards.small({
          place: b[1], href: '#', date: 'Aug ' + (i + 1) + ' 10:25 AM',
          count: 42 - i, distMi: parseFloat(b[2]), map: PIN,
          icons: MARKS[i % MARKS.length]
        });
      }

      // ALL the report's sections. `cards` names the real app builders where
      // the section is made of card templates (mapping from docs/CARDS.md);
      // `todo: true` marks a section whose shape this gallery does NOT yet
      // mirror, and those render greyed with a clearly-labelled stub.
      //
      // The stub for a `todo` section is a SKETCH, deliberately plain, and it
      // says so. It exists to show the section is not empty and roughly what it
      // carries — not to be tuned against. Dressing it up to look finished is
      // how you end up refining a layout the app does not have, which this file
      // already nearly shipped once.
      var SECTIONS = [
        { at: 'surgeBtn', label: '\ud83d\udd14 Bird Gen - Talk and news', todo: true,
          builder: 'checkSurges', note: 'a twitch in progress: species, place, how many birders',
          stub: ['<b>Tufted Puffin</b> \u2014 6 observers in 3 h',
                 'Edmonds Public Fishing Pier \u00b7 11.4 mi'] },
        { at: 'wxBtn', label: '\ud83c\udf24 Twitch weather', todo: true,
          builder: 'weather.py', note: 'wind, rain and tide for the day ahead',
          stub: ['Sat 07:00 \u2014 12 \u00b0C, SW 8 mph, no rain',
                 'Low tide 06:41 \u00b7 high 13:02'] },
        { at: 'rankBtn', label: '\ud83c\udfc6 Top 100', todo: true,
          builder: 'loadRankings', note: 'your standing plus the Top 100 board',
          stub: ['You: #42 in King County, 201 species',
                 '1. Neil Pankey 284 \u00b7 2. Dan McDougall-Treacy 279'] },
        // F28. Immediately after the rankings, matching report.py (section_rankings
        // then section_choice_patches) and the MENU array in index.html — the
        // order of the two is a contract these three files are compared on.
        //
        // NOT a sketch: the section really is built from the medium hotspot card,
        // so the gallery composes it from the same builder the app calls. The
        // leaderboard row is the awkward one worth looking at in a stack — a
        // birder's name as the title with the PLACE in the sub-header, which is
        // the reverse of every other hotspot list here.
        { at: 'patchBtn', label: '\ud83e\udded Pro patches',
          builder: 'patchLeaderCard + patchPlaceCard',
          note: 'one row per birder: their strongest patch and its lift',
          cards: [patchLeader] },
        { at: 'refreshBtn', label: '\ud83c\udf05 Twitches today',
          builder: 'refresh', note: 'one medium species row per bird',
          cards: [speciesMedium] },
        { at: 'activeBtn', label: '\ud83d\udea8 Twitches this week',
          builder: 'loadActiveRarities + rarityChecklistDetails',
          note: 'a medium species row per bird, then the checklists behind it',
          cards: [speciesMedium, checklistSmall] },
        { at: 'abaBtn', label: '\ud83e\udd85 Mega rarities', todo: true,
          builder: 'renderAbaAlert', note: 'continent-wide megas, grouped by state',
          stub: ['<b>Terek Sandpiper</b> \u2014 WA \u00b7 26 reports',
                 '<b>Steller\u2019s Sea-Eagle</b> \u2014 ME \u00b7 4 reports'] },
        { at: 'lastNewBtn', label: '\ud83d\udd2d Fresh ticks',
          builder: 'lastNewCard',
          note: 'a medium species row per bird, then its recent checklists',
          cards: [speciesMedium, checklistSmall] },
        { at: 'tripBtn', label: '\uD83E\uDDED Trip planner',
          builder: 'hotspotCard', note: 'a route of hotspots for one outing',
          cards: [hotspotMedium] },
        { at: 'destBtn', label: '\ud83e\udd47 Today\u2019s patches',
          builder: 'hotspotCard',
          note: 'every hotspot list in the app goes through this one builder',
          cards: [hotspotMedium] },
        { at: 'targetsBtn', label: '\ud83d\udccd Closest patches',
          builder: 'hotspotCard', cards: [hotspotMedium] },
        { at: 'quickBtn', label: '\ud83d\udeb6 Find local patches',
          builder: 'hotspotCard', cards: [hotspotMedium] },
        { at: 'excBtn', label: '\ud83d\ude97 Half-day patches',
          builder: 'hotspotCard', cards: [hotspotMedium] },
        { at: 'fullDayBtn', label: '\ud83d\udee3\ufe0f Full-day patches',
          builder: 'hotspotCard', cards: [hotspotMedium] },
        { at: 'hotBtn', label: '\ud83d\udd25 Hot patches',
          builder: 'hotspotCard', cards: [hotspotMedium] },
        { at: 'coldBtn', label: '\ud83e\udd76 Cold patches',
          builder: 'hotspotCard', cards: [hotspotMedium] },
        { at: 'cklBtn', label: '\ud83e\udd9c Big days',
          builder: 'loadBirdiest', note: 'one medium checklist row per list',
          cards: [checklistMedium] },
        { at: 'convoyBtn', label: '\ud83d\udc65 Convoys',
          builder: 'speciesListHtml', note: 'the small bird rows, nested per convoy',
          cards: [speciesSmall] },
        { at: 'favResults', label: '\ud83d\udd16 Favorite patches',
          builder: 'hotspotCard', cards: [hotspotMedium] },
        { at: 'allUnseenBtn', label: '\ud83c\udfaf Open targets',
          builder: 'speciesPlacesCard + unseenPlacesHtml',
          note: 'a medium species row per bird, then one line per checklist',
          cards: [speciesMedium, checklistSmall] },
        { at: 'spLookupBtn', label: '\ud83d\udd0e Stakeout bird',
          builder: 'renderSpeciesLookup', cards: [speciesMedium] },
        { at: 'easyBtn', label: '\ud83e\udd5a Nemesis birds',
          builder: 'speciesPlacesCard + unseenPlacesHtml',
          cards: [speciesMedium, checklistSmall] },
        { at: 'nvResults', label: '\u2753 Needs proof',
          builder: 'speciesPlacesCard', cards: [speciesMedium] },
        { at: 'migBtn', label: '\ud83d\udeec On passage', todo: true,
          builder: 'loadMigration', note: 'what is arriving and leaving this week',
          stub: ['Arriving: Pectoral Sandpiper, Baird\u2019s Sandpiper',
                 'Leaving: Rufous Hummingbird'] },
        { at: 'bcBody', label: '\ud83c\udf19 BirdCast', todo: true,
          builder: 'loadBirdCast', note: 'last night\u2019s migration intensity',
          stub: ['Last night: <b>Medium</b> \u2014 42,000 birds/km',
                 'Peak 01:00 \u00b7 mostly NNE'] },
        { at: 'todBtn', label: '\ud83c\udf04 Dawn and dusk', todo: true,
          builder: 'todSpecialists', note: 'birds far likelier at dawn or dusk',
          stub: ['Dawn: Barred Owl, Swainson\u2019s Thrush',
                 'Dusk: Common Nighthawk, Black Swift'] },
        { at: 'myYearBody', label: '\ud83d\udcc5 My year', todo: true,
          builder: 'renderMyYear', note: 'your year list and its shape over time',
          stub: ['201 species in Washington, 143 in King',
                 'Latest: Red-throated Loon, Aug 5'] },
        { at: 'settingsPanel', label: '\u2699\ufe0f Settings', todo: true,
          builder: '\u2014', note: 'keys, home location, radius, data controls',
          stub: ['Home: Woodinville, WA \u00b7 chase radius 35 mi',
                 'eBird API key \u00b7 erase all my data'] }
      ];

      var out = document.getElementById('out');

      function wrapFor(fn) {
        // The class the app puts around each family's rows. Kept here rather
        // than inside the card files because it is the SECTION's job, not the
        // row's — the same medium card sits in different containers.
        if (fn === speciesMedium) return 'obs big xl';
        if (fn === speciesSmall) return 'obs card-sm sppl';
        if (fn === hotspotMedium) return 'obs dest';
        // The EXACT class HotspotCards.list('medium', …) emits, which is what
        // the app wraps the choice-patch leaderboard in. Naming it here rather
        // than reusing 'obs dest' keeps the gallery showing the container the
        // section really has — a row is styled by what it sits in.
        if (fn === patchLeader) return 'obs hscards hscards-medium';
        return 'cklcards cklcards-sm';
      }

      function render() {
        var rows = parseInt(document.getElementById('rows').value, 10) || 3;
        var html = '';
        SECTIONS.forEach(function (sec) {
          var todo = !!sec.todo;
          html += '<section class="sec' + (todo ? ' todo' : '') + '">';
          html += '<div class="sechead">' + sec.label +
            (todo ? '<span class="pill">sketch</span>' : '') + '</div>';
          html += '<div class="secmeta">#' + sec.at +
            (sec.builder ? ' \u00b7 <b>' + sec.builder + '()</b>' : '') + '</div>';
          if (sec.note) { html += '<div class="secnote">' + sec.note + '</div>'; }

          if (todo) {
            // A sketch, and labelled as one. It shows the section is not empty
            // and roughly what it carries; it is NOT the app's markup, so it
            // must never be mistaken for a layout to tune.
            html += '<div class="stub">';
            (sec.stub || []).forEach(function (line) {
              html += '<div class="stubrow">' + line + '</div>';
            });
            html += '<div class="stubwhy">Not yet mirrored from the app \u2014 ' +
              'this is a sketch of the content, not its layout.</div></div>';
          } else {
            sec.cards.forEach(function (fn) {
              var body = '';
              for (var i = 0; i < rows; i++) { body += fn(i); }
              html += '<div class="' + wrapFor(fn) + '">' + body + '</div>';
            });
          }
          html += '</section>';
        });
        out.innerHTML = html;
      }

      document.getElementById('scale').addEventListener('change', function () {
        document.documentElement.style.setProperty('--s', this.value);
      });
      document.getElementById('width').addEventListener('change', function () {
        var phone = this.value === 'phone';
        out.classList.toggle('phone', phone);
        out.style.maxWidth = phone ? '402px' : (this.value ? this.value + 'px' : '');
        out.style.outline = (this.value && !phone) ? '1px dashed var(--line)' : '';
        // Inline, alongside the width, so the two cannot disagree — a
        // stylesheet margin against an inline width is what left the frame
        // hard against the right edge in cards.html.
        out.style.marginLeft = phone ? 'auto' : '';
        out.style.marginRight = phone ? 'auto' : '';
      });
      document.getElementById('rows').addEventListener('change', render);

      render();
      document.getElementById('width').dispatchEvent(new Event('change'));

      var built = SECTIONS.filter(function (x) { return !x.todo; }).length;
      document.getElementById('ver').textContent =
        SECTIONS.length + ' sections \u00b7 ' + built + ' built from the app\u2019s card templates \u00b7 ' +
        (SECTIONS.length - built) + ' still sketches';
    }());
  </script>
</body>
</html>
